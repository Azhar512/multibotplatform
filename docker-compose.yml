version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: multibot_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: multibotplatform
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./Backend/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - multibot_network

  # Backend API
  backend:
    build: ./Backend
    container_name: multibot_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/multibotplatform?authSource=admin
      JWT_SECRET: your_production_jwt_secret_change_this
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./Backend/logs:/app/logs
      - ./Backend/uploads:/app/uploads
    networks:
      - multibot_network

  # Frontend
  frontend:
    build: ./frontend
    container_name: multibot_frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_BACKEND_URL: http://localhost:5000
      REACT_APP_WS_URL: ws://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - multibot_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: multibot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - multibot_network

volumes:
  mongodb_data:

networks:
  multibot_network:
    driver: bridge
